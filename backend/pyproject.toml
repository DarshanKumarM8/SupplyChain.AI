[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "supplychain-ai-backend"
version = "0.1.0"
description = "Backend API service for SupplyChain.AI — demand forecasting, inventory optimization, and real-time supply chain intelligence."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "SupplyChain.AI Team" },
]
keywords = ["supply-chain", "fastapi", "ai", "forecasting"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "fastapi==0.115.5",
  "uvicorn[standard]==0.32.1",
  "sqlalchemy[asyncio]==2.0.36",
  "asyncpg==0.30.0",
  "redis==5.2.0",
  "celery[redis]==5.4.0",
  "websockets==13.1",
  "pydantic==2.9.2",
  "pydantic-settings==2.6.1",
  "numpy==2.1.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.7",
  "mypy>=1.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
